workflows:
  sinrutina-ios-check:
    name: SinRutina iOS — comprobar compilación
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Compilar SinRutina sin firma
        script: |
          xcodebuild \
            -project "$CM_BUILD_DIR/ios-sinrutina/SinRutina.xcodeproj" \
            -scheme "SinRutina" \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Logs/Build/**/*.xcactivitylog
