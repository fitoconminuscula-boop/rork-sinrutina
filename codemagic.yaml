workflows:
  sinrutina-signulous:
    name: SinRutina — IPA para Signulous
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest

    scripts:
      - name: Compilar para iPhone sin firma
        script: |
          set -e
          xcodebuild build \
            -project "$CM_BUILD_DIR/ios-sinrutina/SinRutina.xcodeproj" \
            -scheme "SinRutina" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Crear IPA para Signulous
        script: |
          set -e
          APP_PATH="$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos/SinRutina.app"
          test -d "$APP_PATH"

          PACKAGE_DIR="$CM_BUILD_DIR/build/signulous"
          rm -rf "$PACKAGE_DIR"
          mkdir -p "$PACKAGE_DIR/Payload"
          cp -R "$APP_PATH" "$PACKAGE_DIR/Payload/SinRutina.app"

          cd "$PACKAGE_DIR"
          /usr/bin/zip -qry "$CM_BUILD_DIR/build/SinRutina-unsigned.ipa" Payload

    artifacts:
      - build/SinRutina-unsigned.ipa

    publishing:
      email:
        recipients:
          - rarc95@icloud.com
        notify:
          success: true
          failure: true
